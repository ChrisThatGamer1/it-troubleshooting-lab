<!-- Index Page -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Troubleshooting Lab</title>
 </head>
 <body>
   <header>
      <h1>IT Troubleshooting Lab</h1>
      <p>Your starting point for diagnosing technical issues.</p>
   </header>

   <main>
      <section>
         <h2>Describe Your Issue</h2>
         <p>Tell us what's going wrong, and we'll help you investigate.</p>

         <form method="post">
            <label for="issue">What problem are you experiencing?</label>

            <textarea
               id="issue"
               name="issue"
               rows="5"
               placeholder="Example: My computer connects to Wi-Fi, but I cannot access any websites."
            ></textarea>

            <button type="submit">Troubleshoot Issue</button>
         </form>
         {% if issue %}
            <h2>Your Submitted Issue</h2>
            <p>{{ issue }}</p>
         {% endif %}
      </section>
   </main>
 </body>
 </html>
